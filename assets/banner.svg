<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- pulse rings, right side -->
  <g stroke="#89dceb" fill="none">
    <circle cx="980" cy="140" r="20" stroke-width="2" opacity="0.9"/>
    <circle cx="980" cy="140" r="42" stroke-width="2" opacity="0.55"/>
    <circle cx="980" cy="140" r="66" stroke-width="2" opacity="0.32"/>
    <circle cx="980" cy="140" r="92" stroke-width="2" opacity="0.16"/>
  </g>
  <circle cx="980" cy="140" r="8" fill="#89dceb"/>

  <!-- wordmark -->
  <text x="70" y="163" font-family="Menlo, Consolas, 'SF Mono', monospace" font-size="88" font-weight="700" fill="#89dceb" filter="url(#glow)">pulse</text>

  <!-- tagline -->
  <text x="74" y="201" font-family="Menlo, Consolas, 'SF Mono', monospace" font-size="21" fill="#a6adc8">live file tree · watch changes since your last commit</text>

  <!-- status legend -->
  <g font-family="Menlo, Consolas, 'SF Mono', monospace" font-size="16" fill="#a6adc8">
    <circle cx="80" cy="235" r="5" fill="#f9e2af"/>
    <text x="92" y="240">modified</text>
    <circle cx="205" cy="235" r="5" fill="#a6e3a1"/>
    <text x="217" y="240">added</text>
    <circle cx="308" cy="235" r="5" fill="#f38ba8"/>
    <text x="320" y="240">deleted</text>
  </g>
</svg>
